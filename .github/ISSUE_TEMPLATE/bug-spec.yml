name: Bug Specification
description: Report incorrect behavior with required evidence, scope, and validation.
title: "[surface] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        <!-- sdd-spec-version: 1.1 -->
        Use this form for non-trivial defects or regressions.

        Before implementation or dispatch:
        - Replace `[surface]` in the title with the primary implementation surface.
        - This form applies the type label automatically. After creation, add one or more area or domain labels and exactly one priority label.
        - Use `wui`, `gui`, `tui`, or `cli` instead of the legacy `ui` label. Use `brain` as an additional label when relevant, not as the default title prefix.
  - type: input
    id: what
    attributes:
      label: What is broken?
      description: One sentence describing the defect or regression.
      placeholder: The jobs page omits recent runs after local Codex execution.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does this matter?
      description: Describe the user, operator, product, or business impact.
      placeholder: Operators lose visibility into real work and cannot trust the chart.
    validations:
      required: true
  - type: textarea
    id: current-state
    attributes:
      label: Current state or evidence
      description: Include observed behavior, reproduction details, screenshots, logs, or commands.
      placeholder: |
        - Current behavior:
        - Reproduction steps:
        - Evidence or links:
    validations:
      required: true
  - type: textarea
    id: desired-state
    attributes:
      label: Desired behavior
      description: Describe the fixed behavior and any operator-visible outcome.
      placeholder: |
        - Desired behavior:
        - Expected operator result:
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Name the repos, paths, commands, screens, or systems that are in scope.
      placeholder: |
        - Repos:
        - Paths allowed:
        - Paths forbidden:
        - Systems or screens:
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and do-not-dos
      description: Record safety, rollout, data, or architecture constraints and forbidden approaches.
      placeholder: |
        - Keep changes minimal and reversible.
        - Do not widen scope into unrelated modules.
        - Preserve existing data semantics unless explicitly changed.
    validations:
      required: true
  - type: textarea
    id: repo-clarity
    attributes:
      label: "Repository & System Clarity"
      description: |
        Name the exact target repo (matching a repos.yaml key), the system or subdomain affected,
        and — for API/backend work — link the existing endpoint spec or OpenAPI doc.
      placeholder: |
        - Repo: jmh-devel/<repo> (repos.yaml key: <key>)
        - System / subdomain: fos.tacitsoft.dev | turnstileops.com | internal
        - API spec / OpenAPI doc: <link or N/A>
    validations:
      required: true
  - type: textarea
    id: existing-solutions
    attributes:
      label: "Existing System Audit — \"Existing Solutions\""
      description: |
        Paste concrete evidence of what you checked. File paths, grep results, related code.
        Example: "Checked src/controllers/ — found UserController.php at line 42."
      placeholder: |
        - Checked <paths>: <finding>
        - Related code already present: <none | list>
        - Related models, services, or tables: <none | list>
    validations:
      required: true
  - type: textarea
    id: testing-strategy
    attributes:
      label: "Testing Strategy"
      description: |
        How to reproduce and verify the fix locally. Include literal curl commands for API bugs
        and database queries for data bugs.
      placeholder: |
        - Reproduction steps:
        - curl example: curl -X GET https://... -H 'Authorization: Bearer ...'
        - DB state check: SELECT ... FROM ...
        - make test / go test ./... / uv run pytest ...
    validations:
      required: true
  - type: textarea
    id: related-issues
    attributes:
      label: "Related Issues & Blockers"
      description: |
        PRs that must merge first and dependencies on other work. Write "none" if no dependencies.
      placeholder: |
        - Depends on: <#N | none>
        - Blocked by: <issue or PR | none>
        - Related: <issue | none>
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Write concrete done conditions as a checklist.
      placeholder: |
        - [ ] Reproduction no longer fails.
        - [ ] Focused tests cover the defect.
        - [ ] Docs updated if operator behavior changes.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and tests
      description: Record the commands, checks, and evidence that must pass before closure.
      placeholder: |
        - Focused failing test or behavior check:
        - make test
        - make lint
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Explicitly name what this issue must not expand into.
      placeholder: |
        - No unrelated refactors.
        - No unrelated UI redesign.
    validations:
      required: true
  - type: input
    id: primary-surface
    attributes:
      label: Primary surface or owning workflow
      description: This should usually match the bracket title prefix.
      placeholder: agents, server, api, repos, cli, wui, gui, tui, k8s
    validations:
      required: true
  - type: dropdown
    id: requested-priority
    attributes:
      label: Requested priority
      description: Select the urgency tier and apply the matching label after creation.
      options:
        - p0
        - p1
        - p2
        - p3
        - p4
    validations:
      required: true
  - type: input
    id: additional-labels
    attributes:
      label: Additional labels to apply
      description: List area or domain labels to add after the issue is created.
      placeholder: agents, server, auth
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness checks
      options:
        - label: I included acceptance criteria, validation expectations, and out-of-scope boundaries.
          required: true
        - label: I included Repository & System Clarity, Existing System Audit, Testing Strategy, and Related Issues & Blockers.
          required: true
        - label: I understand that labels are authoritative and must be completed before implementation starts.
          required: true