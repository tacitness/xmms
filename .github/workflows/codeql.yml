---
# CodeQL — GitHub static analysis for C memory-safety / security bugs.
# Free for public repos. Builds with CMake (manual build mode) so CodeQL traces
# the real GTK3 compilation.

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly deep scan — Monday 06:00 UTC
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # required to upload results to the Security tab

jobs:
  analyze:
    name: Analyze (C)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libasound2-dev libpulse-dev \
            libvorbis-dev libogg-dev libmpg123-dev libflac-dev \
            libx11-dev libxext-dev libxxf86vm-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: Configure + build (manual mode)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DXMMS_GTK_VERSION=3 \
            -DXMMS_ENABLE_ALSA=ON \
            -DXMMS_ENABLE_PULSE=ON
          cmake --build build -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"
