---
# XMMS Resurrection — CI Pipeline
# Runs on every push to develop/main and on all PRs.
# Jobs:
#   lint        — clang-format + clang-tidy + codespell + shellcheck
#   build       — CMake build matrix for supported Ubuntu LTS releases
#   build-cmake — blocking primary CMake build
#   test        — CTest suite using the CMake build
#   asan        — AddressSanitizer build for memory safety
#   summary     — Final gate job

name: CI

on:
  push:
    branches: [main, develop, "gtk3/**", "gtk4/**", "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks:   write
  pull-requests: write

# ── Global defaults ────────────────────────────────────────────────────────────
defaults:
  run:
    shell: bash

env:
  DEBIAN_FRONTEND: noninteractive

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Lint / Static Analysis ──────────────────────────────────────────────────
  lint:
    name: Lint (${{ matrix.check }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check:
          - clang-format
          - clang-tidy
          - codespell
          - shellcheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── clang-format ─────────────────────────────────────────────────────────
      - name: Install clang-format
        if: matrix.check == 'clang-format'
        run: sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting (clang-format)
        if: matrix.check == 'clang-format'
        run: |
          find . -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            ! -path './intl/*' \
            ! -path './build/*' \
            ! -name 'soundcard.h' \
            -print0 \
            | xargs -0 clang-format-18 --style=file --dry-run --Werror

      # ── clang-tidy ─────────────────────────────────────────────────────────
      - name: Install build deps + clang-tidy
        if: matrix.check == 'clang-tidy'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-18 clang-tidy-18 cmake ninja-build \
            libgtk-3-dev libglib2.0-dev libasound2-dev libpulse-dev \
            libvorbis-dev libogg-dev libmpg123-dev libflac-dev \
            libx11-dev libxext-dev libxxf86vm-dev

      - name: Generate compile_commands.json
        if: matrix.check == 'clang-tidy'
        run: |
          cmake -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-18 \
            -G Ninja \
            -DENABLE_GTK3=ON \
            2>/dev/null || echo "CMakeLists.txt not yet present — skipping clang-tidy"

      - name: Run clang-tidy
        if: matrix.check == 'clang-tidy'
        run: |
          if [[ -f build/compile_commands.json ]]; then
            # Scope clang-tidy to libxmms/*.c only.
            # xmms/ has widespread pre-existing GTK2-era type errors
            # (GdkPixmap, GdkGC, Widget, SkinIndex, etc.) tracked in GH #3
            # P0-critical; these must not block libxmms migration PRs.
            # Header files (.h) are excluded because they fail when compiled
            # standalone (they rely on parent .c include context).
            find libxmms -type f -name '*.c' -print0 \
              | xargs -0 clang-tidy-18 \
                  --config-file=.clang-tidy \
                  -p build \
                  2>&1 | tee clang-tidy-report.txt
            grep -qE "^.*error:" clang-tidy-report.txt && exit 1 || true
          else
            echo "Skipping clang-tidy: no compile_commands.json (CMake migration in progress)"
          fi

      # ── codespell ─────────────────────────────────────────────────────────
      - name: Spell-check (codespell)
        if: matrix.check == 'codespell'
        run: |
          pip install --quiet codespell
          codespell --config .codespellrc \
            xmms/ libxmms/ Input/ Output/ Effect/ General/ Visualization/ \
            scripts/ .github/ README TODO FAQ

      # ── shellcheck ─────────────────────────────────────────────────────────
      - name: Install shellcheck
        if: matrix.check == 'shellcheck'
        run: sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check shell scripts
        if: matrix.check == 'shellcheck'
        run: |
          find scripts/ -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --shell=bash

  # ── Supported CMake Build Matrix ──────────────────────────────────────────
  build:
    name: Build / ${{ matrix.distro }} / GTK${{ matrix.gtk }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-22.04
            image: ubuntu:22.04
            gtk: 3
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            gtk: 3

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libasound2-dev libpulse-dev \
            libvorbis-dev libogg-dev libmpg123-dev libflac-dev \
            libx11-dev libxext-dev libxxf86vm-dev libgl1-mesa-dev

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DXMMS_GTK_VERSION=${{ matrix.gtk }} \
            -DXMMS_ENABLE_MIKMOD=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

  # ── CMake Build (migration target) ────────────────────────────────────────
  build-cmake:
    name: CMake Build (GTK3 / Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libgtk-3-dev libglib2.0-dev libasound2-dev libpulse-dev \
            libvorbis-dev libogg-dev libmpg123-dev libflac-dev \
            libx11-dev libxext-dev libxxf86vm-dev

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DXMMS_GTK_VERSION=3 \
            -DXMMS_ENABLE_ALSA=ON \
            -DXMMS_ENABLE_PULSE=ON \
            -DXMMS_ENABLE_MIKMOD=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-commands-cmake
          path: build/compile_commands.json
          retention-days: 14

  # ── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests / ubuntu-24.04
    runs-on: ubuntu-24.04
    needs: build-cmake

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libgtk-3-dev libglib2.0-dev \
            libasound2-dev libpulse-dev libvorbis-dev libogg-dev \
            libmpg123-dev libflac-dev libx11-dev libxext-dev \
            libxxf86vm-dev libgl1-mesa-dev

      - name: Configure with CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DXMMS_ENABLE_MIKMOD=OFF

      - name: Build test targets
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # ── Memory Safety (ASAN) ───────────────────────────────────────────────────
  asan:
    name: AddressSanitizer Build
    runs-on: ubuntu-24.04
    needs: build-cmake
    # This job still exercises the legacy Autotools sanitizer path.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-18 libasan8 \
            libgtk-3-dev libglib2.0-dev \
            libasound2-dev libpulse-dev \
            libvorbis-dev libogg-dev libx11-dev libxext-dev

      - name: Configure with ASAN
        run: |
          autoreconf -fi || true
          ./configure \
            CC=clang-18 \
            CFLAGS="-std=c11 -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" \
            --prefix=/usr \
            --disable-esd \
            || echo "Configure failed (pre-CMake era) — skipping ASAN build"

      - name: Build with ASAN
        run: |
          if [[ -f Makefile ]]; then
            make -j"$(nproc)" 2>&1 | head -200
          fi

  # ── PR Summary Gate ────────────────────────────────────────────────────────
  summary:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, build-cmake]
    if: always()

    steps:
      - name: Check results
        env:
          LINT_RESULT:  ${{ needs.lint.result }}
          BUILD_RESULT: ${{ needs.build-cmake.result }}
        run: |
          echo "Lint:  $LINT_RESULT"
          echo "Build: $BUILD_RESULT"
          if [[ "$LINT_RESULT" != "success" || "$BUILD_RESULT" != "success" ]]; then
            echo "❌  CI gate FAILED — lint or build did not succeed."
            exit 1
          fi
          echo "✅  CI gate PASSED"
