---
# yamllint configuration for XMMS project
extends: default

# Externally-managed files synced verbatim from tsctl (SDD issue forms) —
# do not lint, so re-syncs via link-agent-bootstrap.sh never churn.
ignore: |
  .github/ISSUE_TEMPLATE/

rules:
  line-length:
    max: 120
    level: warning
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    check-keys: false
  # .clang-format uses alignment-padded colons (BasedOnStyle:    LLVM)
  # which is idiomatic for clang-format files — allow any spaces after ':'
  colons:
    max-spaces-after: -1
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
